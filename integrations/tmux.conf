# Minimal tmux — Random Access Themes
# Works with every flavor and tube: colour4 = the terminal's accent, colour8 = muted,
# `default` = the terminal background (stays translucent on glass).
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 10
set -g history-limit 100000
set -g mouse on
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#W"
set -g automatic-rename on
set -g automatic-rename-format '#{?pane_in_mode,copy,#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}}'

bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style 'bg=default,fg=colour8'
set -g status-left-length 12
set -g status-right-length 48
set -g status-left '#[fg=colour4,bold]#S '
set -g status-right '#[fg=colour8]#{b:pane_current_path} #[fg=colour8]· #[fg=colour4]%H:%M '

set -g window-status-format '#[fg=colour8]#I #W '
set -g window-status-current-format '#[fg=colour4]#I #[fg=default,bold]#W '
set -g window-status-separator ' '

set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=colour4'
set -g message-style 'reverse'
set -g message-command-style 'reverse,dim'
set -g mode-style 'reverse'

setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
