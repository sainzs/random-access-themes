# starship — Random Access Themes
# Works with every flavor and tube: colours are ANSI slots, so `blue`/colour4 is
# whatever accent the terminal theme puts in slot 4 (see integrations/terminal-theme).
add_newline = true
command_timeout = 400

format = """
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$python\
$cmd_duration\
$line_break\
$character"""

[fill]
symbol = " "

[directory]
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
style = "bold blue"
repo_root_style = "bold blue"
read_only = " 󰌾"
read_only_style = "8"
format = "[$path]($style)[$read_only]($read_only_style) "
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "8"
format = "[$symbol$branch]($style) "
truncation_length = 32

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "✖"
untracked = "?"
stashed = "≡"
modified = "●"
staged = "+"
renamed = "»"
deleted = "✘"

[nodejs]
symbol = "󰎙 "
style = "8"
format = "[$symbol$version]($style) "
detect_extensions = []
detect_files = [".nvmrc", ".node-version"]
detect_folders = []

[python]
symbol = "󰌠 "
style = "8"
format = "[$symbol$version]($style) "
detect_extensions = []
detect_files = ["pyproject.toml", ".python-version"]

[cmd_duration]
min_time = 2_000
style = "8"
format = "[󱎫 $duration]($style) "
show_milliseconds = false

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold blue)"

[package]
disabled = true

[rust]
disabled = true
