<text x="144" y="416" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="400"><tspan fill="#00ffb2">Flavor</tspan><tspan fill="#9cb7af"> = </tspan><tspan fill="#35d5c5">Literal</tspan><tspan fill="#9cb7af">[</tspan><tspan fill="#a2e5b8">"random-access"</tspan><tspan fill="#9cb7af">, </tspan><tspan fill="#a2e5b8">"veridis"</tspan><tspan fill="#9cb7af">, </tspan><tspan fill="#a2e5b8">"voyager"</tspan><tspan fill="#9cb7af">, </tspan><tspan fill="#a2e5b8">"amnesiac"</tspan><tspan fill="#9cb7af">]</tspan></text>
<text x="144" y="466" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="400"><tspan fill="#35d5c5">@dataclass</tspan><tspan fill="#d8efe9">(frozen=</tspan><tspan fill="#00ffb2">True</tspan><tspan fill="#d8efe9">)</tspan></text>
<text x="144" y="494" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="400"><tspan fill="#66e3c4">class</tspan><tspan fill="#00ffb2"> PreviewTheme</tspan><tspan fill="#9cb7af">:</tspan></text>
