<text x="144" y="550" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="400"><tspan fill="#d8efe9">    accent</tspan><tspan fill="#9cb7af">: </tspan><tspan fill="#35d5c5">str</tspan><tspan fill="#9cb7af"> = </tspan><tspan fill="#a2e5b8">"#00ffb2"</tspan></text>
<text x="144" y="578" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="400"><tspan fill="#d8efe9">    background</tspan><tspan fill="#9cb7af">: </tspan><tspan fill="#35d5c5">str</tspan><tspan fill="#9cb7af"> = </tspan><tspan fill="#a2e5b8">"#000000"</tspan></text>
<text x="144" y="606" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="400"><tspan fill="#d8efe9">    contrast_ratio</tspan><tspan fill="#9cb7af">: </tspan><tspan fill="#35d5c5">float</tspan><tspan fill="#9cb7af"> = </tspan><tspan fill="#8bf5dd">17.44</tspan></text>
<text x="144" y="656" xml:space="preserve" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="400"><tspan fill="#66e3c4">    def</tspan><tspan fill="#00ffb2"> passes_aa</tspan><tspan fill="#d8efe9">(self, ratio</tspan><tspan fill="#9cb7af">: </tspan><tspan fill="#35d5c5">float</tspan><tspan fill="#9cb7af"> = </tspan><tspan fill="#8bf5dd">17.44</tspan><tspan fill="#9cb7af">) -&gt; </tspan><tspan fill="#35d5c5">bool</tspan><tspan fill="#9cb7af">:</tspan></text>
