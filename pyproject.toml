[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "random-access-themes"
version = "0.1.1"
description = "OLED-black dark themes for terminals and editors — four flavors, zero warm syntax hues."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Santiago Sainz", email = "sainzs@users.noreply.github.com" }]
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/sainzs/random-access-themes"
Repository = "https://github.com/sainzs/random-access-themes"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
