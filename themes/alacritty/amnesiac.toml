# Amnesiac — Alacritty
# Warm-black dark palette. Indigo accent. Named after Radiohead's Amnesiac.
# https://github.com/sainzs/random-access-themes

[colors.primary]
background = "#000000"
foreground = "#f2efec"

[colors.cursor]
cursor = "#7b93ff"
text   = "#000000"

[colors.selection]
background = "#2a2623"
text       = "#f2efec"

[colors.normal]
black    = "#0f0e0d"
red      = "#ff7a5c"
green    = "#9baaf2"
yellow   = "#e8c878"
blue     = "#6b7ef5"
magenta  = "#7b93ff"
cyan     = "#b4bef0"
white    = "#f2efec"

[colors.bright]
black    = "#817771"
red      = "#ff9377"
green    = "#9baaf2"
yellow   = "#f2d8a0"
blue     = "#7b93ff"
magenta  = "#b4bef0"
cyan     = "#c8d2ff"
white    = "#dce2ff"
