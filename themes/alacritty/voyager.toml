# Voyager — Alacritty
# Warm-black dark palette. Vibrant electric teal accent. Named after Daft Punk's Voyager.
# https://github.com/sainzs/random-access-themes

[colors.primary]
background = "#000000"
foreground = "#f2efec"

[colors.cursor]
cursor = "#2ccfc0"
text   = "#000000"

[colors.selection]
background = "#2a2623"
text       = "#f2efec"

[colors.normal]
black    = "#0f0e0d"
red      = "#ff7a5c"
green    = "#7dd4cc"
yellow   = "#e8c878"
blue     = "#22b8ab"
magenta  = "#2ccfc0"
cyan     = "#a8ddd9"
white    = "#f2efec"

[colors.bright]
black    = "#817771"
red      = "#ff9377"
green    = "#7dd4cc"
yellow   = "#f2d8a0"
blue     = "#2ccfc0"
magenta  = "#a8ddd9"
cyan     = "#c5ebe8"
white    = "#ddf4f2"
