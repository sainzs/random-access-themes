yellow   = "#d8a657"
blue     = "#8a8380"
magenta  = "#eeeeee"
cyan     = "#ef6f2e"
white    = "#eeeeee"

[colors.bright]
black    = "#5c5855"
red      = "#e54048"
green    = "#6fab78"
yellow   = "#d8a657"
blue     = "#ef6f2e"
magenta  = "#ef6f2e"
