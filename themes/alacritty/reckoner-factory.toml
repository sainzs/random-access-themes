# Orange Factory — Alacritty
# Safety orange on true black — machine-shop signage under work lights.
# https://github.com/sainzs/random-access-themes

[colors.primary]
background = "#020202"
foreground = "#eeeeee"

[colors.cursor]
cursor = "#ef6f2e"
text   = "#020202"

[colors.selection]
background = "#1f1d1c"
