# Veridis — Alacritty
# Warm-black dark palette. Electric mint accent. Named after Daft Punk's Veridis Quo.
# https://github.com/sainzs/random-access-themes

[colors.primary]
background = "#000000"
foreground = "#f2efec"

[colors.cursor]
cursor = "#00ffb2"
text   = "#000000"

[colors.selection]
background = "#2a2623"
text       = "#f2efec"

[colors.normal]
black    = "#0f0e0d"
red      = "#ff7a5c"
green    = "#4de8c0"
yellow   = "#e8c878"
blue     = "#00e0a0"
magenta  = "#00ffb2"
cyan     = "#7adec8"
white    = "#f2efec"

[colors.bright]
black    = "#817771"
red      = "#ff9377"
green    = "#4de8c0"
yellow   = "#f2d8a0"
blue     = "#00ffb2"
magenta  = "#7adec8"
cyan     = "#a8f0de"
white    = "#d0f7ec"
