# Aerodynamic — Alacritty
# OLED-black dark palette. Mint-forward, green-family syntax, minimal noise. Named after Daft Punk's Aerodynamic.
# https://github.com/sainzs/random-access-themes

[colors.primary]
background = "#000000"
foreground = "#d8efe9"

[colors.cursor]
cursor = "#00ffb2"
text   = "#000000"

[colors.selection]
background = "#1a1c20"
text       = "#d8efe9"

[colors.normal]
black    = "#090a0b"
red      = "#ff7a5c"
green    = "#4ade80"
yellow   = "#e8c878"
blue     = "#26c994"
magenta  = "#00ffb2"
cyan     = "#66e3c4"
white    = "#d8efe9"

[colors.bright]
black    = "#6f8d86"
red      = "#ff9377"
green    = "#7de8a6"
yellow   = "#f2d8a0"
blue     = "#00ffb2"
magenta  = "#35d5c5"
cyan     = "#8bf5dd"
white    = "#eef8f3"
