# Voyager — Ghostty
# Warm-black dark palette. Vibrant electric teal accent. Named after Daft Punk's Voyager.
# https://github.com/sainzs/random-access-themes

background = 000000
foreground = f2efec

cursor-color = 2ccfc0
cursor-text = 000000
cursor-style       = block
cursor-style-blink = true

selection-background = 2a2623
selection-foreground = f2efec

split-divider-color = 000000
unfocused-split-fill = 000000

minimum-contrast = 1.2

# ANSI 16-color palette
palette = 0=#0f0e0d
palette = 1=#ff7a5c
palette = 2=#7dd4cc
palette = 3=#e8c878
palette = 4=#22b8ab
palette = 5=#2ccfc0
palette = 6=#a8ddd9
palette = 7=#f2efec
palette = 8=#817771
palette = 9=#ff9377
palette = 10=#7dd4cc
palette = 11=#f2d8a0
palette = 12=#2ccfc0
palette = 13=#a8ddd9
palette = 14=#c5ebe8
palette = 15=#ddf4f2
