# Veridis — Ghostty
# Warm-black dark palette. Electric mint accent. Named after Daft Punk's Veridis Quo.
# https://github.com/sainzs/random-access-themes

background = 000000
foreground = f2efec

cursor-color = 00ffb2
cursor-text = 000000
cursor-style       = block
cursor-style-blink = true

selection-background = 2a2623
selection-foreground = f2efec

split-divider-color = 000000
unfocused-split-fill = 000000

minimum-contrast = 1.2

# ANSI 16-color palette
palette = 0=#0f0e0d
palette = 1=#ff7a5c
palette = 2=#4de8c0
palette = 3=#e8c878
palette = 4=#00e0a0
palette = 5=#00ffb2
palette = 6=#7adec8
palette = 7=#f2efec
palette = 8=#817771
palette = 9=#ff9377
palette = 10=#4de8c0
palette = 11=#f2d8a0
palette = 12=#00ffb2
palette = 13=#7adec8
palette = 14=#a8f0de
palette = 15=#d0f7ec
