# WOPR — Ghostty
# VT100 blue screen — cyan and white-blue, the war room.
# https://github.com/sainzs/random-access-themes

background = 0b1d3a
foreground = d9ecff

cursor-color = 6fc4ff
cursor-text  = 0b1d3a
cursor-style       = block
cursor-style-blink = false

selection-background = 14294d
selection-foreground = d9ecff

minimum-contrast = 1.2

# ANSI 16-color palette
palette = 0=#14294d
palette = 1=#ff7a8a
palette = 2=#7de0a8
palette = 3=#ffd75f
palette = 4=#6f9cd0
palette = 5=#d9ecff
palette = 6=#6fc4ff
palette = 7=#d9ecff
palette = 8=#31548a
palette = 9=#ff7a8a
palette = 10=#7de0a8
palette = 11=#ffd75f
palette = 12=#6fc4ff
palette = 13=#c4e6ff
palette = 14=#c4e6ff
palette = 15=#c4e6ff
