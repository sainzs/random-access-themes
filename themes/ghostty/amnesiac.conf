# Amnesiac — Ghostty
# Warm-black dark palette. Indigo accent. Named after Radiohead's Amnesiac.
# https://github.com/sainzs/random-access-themes

background = 000000
foreground = f2efec

cursor-color = 7b93ff
cursor-text = 000000
cursor-style       = block
cursor-style-blink = true

selection-background = 2a2623
selection-foreground = f2efec

split-divider-color = 000000
unfocused-split-fill = 000000

minimum-contrast = 1.2

# ANSI 16-color palette
palette = 0=#0f0e0d
palette = 1=#ff7a5c
palette = 2=#9baaf2
palette = 3=#e8c878
palette = 4=#6b7ef5
palette = 5=#7b93ff
palette = 6=#b4bef0
palette = 7=#f2efec
palette = 8=#817771
palette = 9=#ff9377
palette = 10=#9baaf2
palette = 11=#f2d8a0
palette = 12=#7b93ff
palette = 13=#b4bef0
palette = 14=#c8d2ff
palette = 15=#dce2ff
