# Aerodynamic — Ghostty
# OLED-black dark palette. Mint-forward, green-family syntax, minimal noise. Named after Daft Punk's Aerodynamic.
# https://github.com/sainzs/random-access-themes

background = 000000
foreground = d8efe9

cursor-color = 00ffb2
cursor-text = 000000
cursor-style       = block
cursor-style-blink = true

selection-background = 1a1c20
selection-foreground = d8efe9

split-divider-color = 000000
unfocused-split-fill = 000000

minimum-contrast = 1.2

# ANSI 16-color palette
palette = 0=#090a0b
palette = 1=#ff7a5c
palette = 2=#4ade80
palette = 3=#e8c878
palette = 4=#26c994
palette = 5=#00ffb2
palette = 6=#66e3c4
palette = 7=#d8efe9
palette = 8=#6f8d86
palette = 9=#ff9377
palette = 10=#7de8a6
palette = 11=#f2d8a0
palette = 12=#00ffb2
palette = 13=#35d5c5
palette = 14=#8bf5dd
palette = 15=#eef8f3
