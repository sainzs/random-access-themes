# Green Scope — Ghostty
# DEC VT640 radar — P1 green on green glass.
# https://github.com/sainzs/random-access-themes

background = 0a120c
foreground = 6fe392

cursor-color = a8ffc2
cursor-text = 0a120c
cursor-style       = block
cursor-style-blink = false

selection-background = 2f3c32
selection-foreground = 6fe392

split-divider-color = 0a120c
unfocused-split-fill = 0a120c

minimum-contrast = 1.2

# ANSI 16-color palette
palette = 0=#2f3c32
palette = 1=#ff7a5c
palette = 2=#6fe392
palette = 3=#e8d25f
palette = 4=#55a06b
palette = 5=#6fe392
palette = 6=#a8ffc2
palette = 7=#6fe392
palette = 8=#506d58
palette = 9=#ff7a5c
palette = 10=#6fe392
palette = 11=#e8d25f
palette = 12=#a8ffc2
palette = 13=#dcffe7
palette = 14=#dcffe7
palette = 15=#dcffe7
