# Amber EXECT — Ghostty
# EXECT-100 / DEC VT520 — amber phosphor on warm near-black.
# https://github.com/sainzs/random-access-themes

background = 16100a
foreground = ffb753

cursor-color = ffd280
cursor-text = 16100a
cursor-style       = block
cursor-style-blink = false

selection-background = 50442f
selection-foreground = ffb753

split-divider-color = 16100a
unfocused-split-fill = 16100a

minimum-contrast = 1.2

# ANSI 16-color palette
palette = 0=#50442f
palette = 1=#ff6242
palette = 2=#9acc63
palette = 3=#ffdf6b
palette = 4=#b07f33
palette = 5=#ffb753
palette = 6=#ffd280
palette = 7=#ffb753
palette = 8=#796344
palette = 9=#ff6242
palette = 10=#9acc63
palette = 11=#ffdf6b
palette = 12=#ffd280
palette = 13=#ffe9bd
palette = 14=#ffe9bd
palette = 15=#ffe9bd
