# Orange Factory — WezTerm color scheme
# Safety orange on true black — machine-shop signage under work lights.
# https://github.com/sainzs/random-access-themes
#
# Place in ~/.config/wezterm/colors/
# Then set: config.color_scheme = "Orange Factory"

[colors]
foreground    = "#eeeeee"
background    = "#020202"
cursor_bg     = "#ef6f2e"
cursor_border = "#ef6f2e"
cursor_fg     = "#020202"
selection_bg  = "#35261f"
selection_fg  = "#eeeeee"
ansi          = ["#35261f", "#e54048", "#6fab78", "#d8a657", "#8a8380", "#eeeeee", "#ef6f2e", "#eeeeee"]
brights       = ["#63605d", "#e54048", "#6fab78", "#d8a657", "#ef6f2e", "#ef6f2e", "#ef6f2e", "#ef6f2e"]

[metadata]
name       = "Orange Factory"
origin_url = "https://github.com/sainzs/random-access-themes"
