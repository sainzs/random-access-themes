# Voyager — WezTerm color scheme
# Warm-black dark palette. Vibrant electric teal accent. Named after Daft Punk's Voyager.
# https://github.com/sainzs/random-access-themes
#
# Place in ~/.config/wezterm/colors/
# Then set: config.color_scheme = "Voyager"

[colors]
foreground    = "#f2efec"
background    = "#000000"
cursor_bg     = "#2ccfc0"
cursor_border = "#2ccfc0"
cursor_fg     = "#000000"
selection_bg  = "#2a2623"
selection_fg  = "#f2efec"
ansi          = ["#0f0e0d", "#ff7a5c", "#7dd4cc", "#e8c878", "#22b8ab", "#2ccfc0", "#a8ddd9", "#f2efec"]
brights       = ["#817771", "#ff9377", "#7dd4cc", "#f2d8a0", "#2ccfc0", "#a8ddd9", "#c5ebe8", "#ddf4f2"]

[metadata]
name       = "Voyager"
origin_url = "https://github.com/sainzs/random-access-themes"
