# Violet Dusk — WezTerm color scheme
# Violet on blue-black — late light, cold screen.
# https://github.com/sainzs/random-access-themes
#
# Place in ~/.config/wezterm/colors/
# Then set: config.color_scheme = "Violet Dusk"

[colors]
foreground    = "#d8d9e6"
background    = "#1c1b29"
cursor_bg     = "#a489d8"
cursor_border = "#a489d8"
cursor_fg     = "#1c1b29"
selection_bg  = "#383145"
selection_fg  = "#d8d9e6"
ansi          = ["#383145", "#f49ab5", "#67d4ff", "#e7c76b", "#8b90b3", "#d8d9e6", "#a489d8", "#d8d9e6"]
brights       = ["#706985", "#f49ab5", "#67d4ff", "#e7c76b", "#a489d8", "#c099ff", "#c099ff", "#c099ff"]

[metadata]
name       = "Violet Dusk"
origin_url = "https://github.com/sainzs/random-access-themes"
