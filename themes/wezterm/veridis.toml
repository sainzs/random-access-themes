# Veridis — WezTerm color scheme
# Warm-black dark palette. Electric mint accent. Named after Daft Punk's Veridis Quo.
# https://github.com/sainzs/random-access-themes
#
# Place in ~/.config/wezterm/colors/
# Then set: config.color_scheme = "Veridis"

[colors]
foreground    = "#f2efec"
background    = "#000000"
cursor_bg     = "#00ffb2"
cursor_border = "#00ffb2"
cursor_fg     = "#000000"
selection_bg  = "#2a2623"
selection_fg  = "#f2efec"
ansi          = ["#0f0e0d", "#ff7a5c", "#4de8c0", "#e8c878", "#00e0a0", "#00ffb2", "#7adec8", "#f2efec"]
brights       = ["#817771", "#ff9377", "#4de8c0", "#f2d8a0", "#00ffb2", "#7adec8", "#a8f0de", "#d0f7ec"]

[metadata]
name       = "Veridis"
origin_url = "https://github.com/sainzs/random-access-themes"
