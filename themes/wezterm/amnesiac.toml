# Amnesiac — WezTerm color scheme
# Warm-black dark palette. Indigo accent. Named after Radiohead's Amnesiac.
# https://github.com/sainzs/random-access-themes
#
# Place in ~/.config/wezterm/colors/
# Then set: config.color_scheme = "Amnesiac"

[colors]
foreground    = "#f2efec"
background    = "#000000"
cursor_bg     = "#7b93ff"
cursor_border = "#7b93ff"
cursor_fg     = "#000000"
selection_bg  = "#2a2623"
selection_fg  = "#f2efec"
ansi          = ["#0f0e0d", "#ff7a5c", "#9baaf2", "#e8c878", "#6b7ef5", "#7b93ff", "#b4bef0", "#f2efec"]
brights       = ["#817771", "#ff9377", "#9baaf2", "#f2d8a0", "#7b93ff", "#b4bef0", "#c8d2ff", "#dce2ff"]

[metadata]
name       = "Amnesiac"
origin_url = "https://github.com/sainzs/random-access-themes"
