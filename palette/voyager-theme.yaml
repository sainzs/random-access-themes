# Voyager Theme — canonical palette
# Single source of truth. All terminal exports are generated from this file.
#
# Named after Daft Punk's "Voyager" (Discovery, 2001).
# Warm-dark backgrounds, cream near-white text, vibrant electric teal accent.
#
# Run:  python3 scripts/generate.py --palette palette/voyager-theme.yaml

meta:
  name:         voyager
  display_name: "Voyager"
  description:  "Warm-black dark palette. Vibrant electric teal accent. Named after Daft Punk's Voyager."
  version:      "0.2.0"
  author:       sainzs
  github:       sainzs/random-access-themes

palette:
  # ── Backgrounds (warm dark) ────────────────────────────────────────────────
  bg:      "#000000"   # pure black — absolute OLED
  bg1:     "#0f0e0d"   # warm near-black — deepest panel
  bg2:     "#1a1715"   # visible warm surface step
  surface: "#141210"   # card / message backgrounds
  overlay: "#2a2623"   # selection, popover, splits

  # ── Text (crisp for Retina MBP) ─────────────────────────────────────────────
  text:    "#f2efec"   # primary — crisp off-white
  subtle:  "#b1a8a2"   # secondary / labels — warm muted grey
  dimText: "#817771"   # muted / comments — readable taupe grey
  cursor:  "#2ccfc0"   # cursor — vibrant electric teal

  # ── Accent family — vibrant electric teal ───────────────────────────────────
  mint:    "#2ccfc0"   # hero — vibrant electric teal
  cyan:    "#22b8ab"   # saturated teal (links / type)
  green:   "#7dd4cc"   # muted teal (success / functions)
  teal:    "#1a9e91"   # deep teal (quotes / borders)
  jade:    "#a8ddd9"   # soft teal-grey (thinking / keywords)
  aqua:    "#c5ebe8"   # pale teal (numbers / highlights)
  emerald: "#0f7a6e"   # dark teal (errors)
  lime:    "#ddf4f2"   # teal-white (strings / warnings)

  # ── Diff backgrounds (editor ports) ─────────────────────────────────────────
  diffAddBg: "#001a17"   # added-line background
  diffRemBg: "#0a1412"   # removed-line background

# ── ANSI 16-color palette ────────────────────────────────────────────────────
# Warm-grey neutral base + vibrant teal accent family.
ansi:
  # Phosphor ramp — cyan CRT (dark.spaceAMP family), warm-black glass.
  # One hue in luminance steps + shared warm LED pair (house standard).
  normal:
    black:   "#0f0e0d"   # bg1
    red:     "#ff7a5c"   # LED red-orange (signal)
    green:   "#7dd4cc"   # soft teal
    yellow:  "#e8c878"   # phosphor amber (signal)
    blue:    "#22b8ab"   # base teal
    magenta: "#2ccfc0"   # hero — electric teal
    cyan:    "#a8ddd9"   # pale teal
    white:   "#f2efec"   # text
  bright:
    black:   "#817771"   # dimText
    red:     "#ff9377"   # bright LED
    green:   "#7dd4cc"   # soft step
    yellow:  "#f2d8a0"   # bright amber
    blue:    "#2ccfc0"   # hero teal
    magenta: "#a8ddd9"   # pale teal
    cyan:    "#c5ebe8"   # bright teal
    white:   "#ddf4f2"   # bright text
