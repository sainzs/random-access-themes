# Veridis Theme — canonical palette
# Single source of truth. All terminal exports are generated from this file.
#
# Named after Daft Punk's "Veridis Quo" (Discovery, 2001).
# Warm-dark backgrounds, cream near-white text, electric mint accent.
#
# Run:  python3 scripts/generate.py --palette palette/veridis-theme.yaml

meta:
  name:         veridis
  display_name: "Veridis"
  description:  "Warm-black dark palette. Electric mint accent. Named after Daft Punk's Veridis Quo."
  version:      "0.2.0"
  author:       sainzs
  github:       sainzs/random-access-themes

palette:
  # ── Backgrounds (warm dark) ────────────────────────────────────────────────
  bg:      "#000000"   # pure black — absolute OLED
  bg1:     "#0f0e0d"   # warm near-black — deepest panel
  bg2:     "#1a1715"   # visible warm surface step
  surface: "#141210"   # card / message backgrounds
  overlay: "#2a2623"   # selection, popover, splits

  # ── Text (crisp for Retina MBP) ─────────────────────────────────────────────
  text:    "#f2efec"   # primary — crisp off-white
  subtle:  "#b1a8a2"   # secondary / labels — warm muted grey
  dimText: "#817771"   # muted / comments — readable taupe grey
  cursor:  "#00ffb2"   # cursor — electric mint

  # ── Accent family — electric mint ───────────────────────────────────────────
  mint:    "#00ffb2"   # hero — electric mint
  cyan:    "#00e0a0"   # deeper mint (links / type)
  green:   "#4de8c0"   # vivid mint-green (success / functions)
  teal:    "#00c490"   # deep mint (quotes / borders)
  jade:    "#7adec8"   # soft mint-grey (thinking / keywords)
  aqua:    "#a8f0de"   # pale mint (numbers / highlights)
  emerald: "#00a878"   # dark mint (errors)
  lime:    "#d0f7ec"   # mint-white (strings / warnings)

  # ── Diff backgrounds (editor ports) ─────────────────────────────────────────
  diffAddBg: "#001a10"   # added-line background
  diffRemBg: "#0a1410"   # removed-line background

# ── ANSI 16-color palette ────────────────────────────────────────────────────
# Warm-grey neutral base + electric mint accent family.
ansi:
  # Phosphor ramp — green phosphor (P1 handheld / Synclavier family).
  # One hue in luminance steps + shared warm LED pair (house standard).
  normal:
    black:   "#0f0e0d"   # bg1
    red:     "#ff7a5c"   # LED red-orange (signal)
    green:   "#4de8c0"   # soft mint
    yellow:  "#e8c878"   # phosphor amber (signal)
    blue:    "#00e0a0"   # deep mint
    magenta: "#00ffb2"   # hero mint
    cyan:    "#7adec8"   # pale jade
    white:   "#f2efec"   # text
  bright:
    black:   "#817771"   # dimText
    red:     "#ff9377"   # bright LED
    green:   "#4de8c0"   # soft step
    yellow:  "#f2d8a0"   # bright amber
    blue:    "#00ffb2"   # hero mint
    magenta: "#7adec8"   # pale jade
    cyan:    "#a8f0de"   # bright jade
    white:   "#d0f7ec"   # bright text
